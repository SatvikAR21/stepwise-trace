# Checks that run automatically before every commit.
# Local hooks: they call the project's own pinned tools through uv, so nothing extra is downloaded.
# Install once:  uv run --project backend pre-commit install
# Run by hand:   uv run --project backend pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --force-exclude
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format --check
        entry: uv run --project backend ruff format --check --force-exclude
        language: system
        types: [python]
        files: ^backend/
      - id: mypy
        name: mypy (strict)
        entry: uv run --directory backend mypy app tests
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
